# btop config. Tracked in ~/.config, so it is shared with the personal Mac.
# Settings not listed here use btop's defaults (`btop --default-config`).

# Stop btop from rewriting this file on every exit (that dirties the repo).
# Change settings by editing this file, not from the btop menu.
save_config_on_exit = false

# Match the Ghostty theme (TokyoNight Storm) and use the terminal background.
color_theme = "tokyo-storm"
theme_background = false
