"$schema" = 'https://starship.rs/config-schema.json'

# Caps how long any single prompt module may run before starship gives up on it.
# Keep this tight so a slow `git status` (e.g. the space-flavor monorepo) or a
# cold fnm `node --version` shim can never stall the prompt for more than ~0.5s.
# The trade-off: in a genuinely slow repo, git/version info may occasionally be
# omitted rather than blocking the prompt — a deliberate choice for consistency.
command_timeout = 500

# the actual prompt

format = """
[](color_orange)\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
[](fg:color_bg3 bg:color_bg1)\
$cmd_duration\
$status\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

# Not in `format`: `starship timings` showed ~30-48 ms per prompt just to
# detect the OS. Kept disabled so re-adding $os is a deliberate choice.
[os]
disabled = true
style = "bg:color_orange fg:color_fg0"

# Shown only over SSH or as root.
[username]
show_always = false
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[line_break]
disabled = false

# Long-running command: shown only when it took >= 2 s.
[cmd_duration]
min_time = 2000
style = "bg:color_bg1"
format = '[[  $duration ](fg:color_yellow bg:color_bg1)]($style)'

# Exit code of the last command: shown only on failure, as a red
# powerline segment inside the dark time segment. Signals add the name
# (e.g. 130 SIGINT).
[status]
disabled = false
symbol = ""
style = "bg:color_red"
format = '[](fg:color_bg1 bg:color_red)[ $symbol $status( SIG$signal_name) ](fg:color_fg0 bg:color_red)[](fg:color_red bg:color_bg1)'

# symbols
[aws]
symbol = " "

[buf]
symbol = ""
format = '(with [$symbol($version )]($style))'

[bun]
format = '(via [$symbol($version )]($style))'

[c]
symbol = ""
format = '(via [$symbol($version(-$name) )]($style))'

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'

[cmake]
symbol = ""
format = '(via [$symbol($version )]($style))'

[conda]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[crystal]
symbol = ""
format = '(via [$symbol($version )]($style))'

[daml]
format = '(via [$symbol($version )]($style))'

[dart]
symbol = ""
format = '(via [$symbol($version )]($style))'

[deno]
format = '(via [$symbol($version )]($style))'

[dotnet]
format = '(via [$symbol($version )(🎯 $tfm )]($style))'

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[elixir]
symbol = ""
format = '(via [$symbol($version \(OTP $otp_version\) )]($style))'

[elm]
