[fossil_branch]
symbol = ""

[git_branch]
style = "bg:color_aqua"
symbol = ""
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_commit]
tag_symbol = '  '

# Starship >= 1.23 computes status with gitoxide, which ignores git's
# untracked cache and fsmonitor: 2-4x slower in the big monorepos here.
[git_status]
use_git_executable = true
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[gleam]
format = '(via [$symbol($version )]($style))'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[guix_shell]
symbol = ""

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[helm]
format = '(via [$symbol($version )]($style))'

[haxe]
