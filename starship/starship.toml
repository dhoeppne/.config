# `.python-version` alone is not a trigger: JS repos that carry a stale pin
# make the pyenv `python` shim fail slowly (~0.5 s, the command_timeout).
[python]
symbol = ""
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", "tox.ini", "setup.py", "__init__.py"]
style = "bg:color_blue"
format = '[[ $symbol( $version)( \($virtualenv\)) ](fg:color_fg0 bg:color_blue)]($style)'

[raku]
